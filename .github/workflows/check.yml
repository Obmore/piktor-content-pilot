name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_engine.cjs
      - run: npm install --prefix .qa --no-save --ignore-scripts jsdom@26.1.0
      - run: NODE_PATH="$PWD/.qa/node_modules" node --test web/review.test.cjs
      - run: python -m pilot audit --input data/pilot.json --strict
      - run: python build_demo.py
      - run: git diff --exit-code -- web/data.js web/supplier-data.js dist/
