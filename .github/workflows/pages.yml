name: Publish sample to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check processing and exports
        run: |
          python -m unittest discover -s tests -v
          node --test tests/test_engine.cjs
          python -m pilot audit --input data/pilot.json --strict
      - name: Check page behavior
        run: |
          npm install --prefix .qa --no-save --ignore-scripts jsdom@26.1.0
          NODE_PATH="$PWD/.qa/node_modules" node --test web/review.test.cjs
      - name: Build standalone sample
        run: |
          python build_demo.py
          mkdir -p .pages
          cp dist/Piktor94_bemutato.html .pages/index.html
          touch .pages/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
